<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G32 BLE-Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>G32 BLE-Explorer</h1>
    <p class="hint">
      Read-only: listet Services und Characteristics, loggt Daten als Hex und zeigt die dekodierten Werte.
      Es wird nichts geschrieben. Vorher: Otto-Wilde-App schließen, am Grill Bluetooth-Taste 2 s drücken.
      <a href="index.html">Zum Dashboard</a>
    </p>

    <section>
      <label>Service-UUIDs (kommagetrennt)
        <input id="uuids">
      </label>
      <label class="check"><input type="checkbox" id="all"> Alle BLE-Geräte anzeigen (statt nur „OWG-G32C…“)</label>
      <div class="row">
        <button id="connect">Verbinden</button>
        <button id="disconnect" disabled>Trennen</button>
        <button id="download" disabled>Log als .txt</button>
        <span id="status" class="status">Nicht verbunden</span>
      </div>
    </section>

    <section>
      <h2>Services</h2>
      <pre id="services">–</pre>
    </section>

    <section>
      <h2>Dekodierte Werte</h2>
      <pre id="decoded">–</pre>
    </section>

    <section>
      <h2>Rohdaten-Log</h2>
      <pre id="log"></pre>
    </section>
  </main>
  <script type="module" src="js/explorer.js"></script>
</body>
</html>
