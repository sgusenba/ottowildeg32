; ESP32-Bridge für den G32 Connected: BLE (NimBLE) -> WLAN (Webserver + WebSocket)
; Bauen:        pio run
; Firmware:     pio run -t upload
; Web-Dateien:  pio run -t uploadfs      (kopiert vorher ../web nach data/, siehe sync_web.py)
; Anderes Board? board unten anpassen (NimBLE läuft auf ESP32, S3, C3).

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:sync_web.py
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  links2004/WebSockets@^2.6.1

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:sync_web.py
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  links2004/WebSockets@^2.6.1
